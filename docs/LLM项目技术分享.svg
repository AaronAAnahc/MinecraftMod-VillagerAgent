<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VillagerAgent：LLM 丰富行为，框架约束执行</title>
  <desc id="desc">当前实现的职责示意：角色和世界上下文支撑 LLM 的表达、目标提议、交易协商、结构生成与记忆压缩；Harness 和协议接入提供局部防护、解析与日志；规则调度和技能执行核对实际状态。每日结构化决策尚未接入主循环，部分 LLM 调用尚未统一经过 Guard。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#263747" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #182a3a; }
      .secondary { fill: #5b6b79; }
      .outline { fill: #fff; stroke: #263747; stroke-width: 1.7; }
      .line { fill: none; stroke: #263747; stroke-width: 1.7; }
      .divider { stroke: #c6cdd3; stroke-width: 1; }
      .label { font-size: 21px; font-weight: 700; }
      .body { font-size: 20px; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="white"/>

  <text x="80" y="61" font-size="17" letter-spacing="2" class="secondary">VILLAGERAGENT / 当前实现</text>
  <text x="80" y="126" font-size="44" font-weight="700">LLM 丰富行为，框架约束执行</text>
  <text x="82" y="171" font-size="23" class="secondary">角色化表达与目标提议，落到可检查的任务、技能和世界状态。</text>

  <!-- Input context -->
  <rect x="80" y="210" width="1440" height="65" rx="5" class="outline"/>
  <text x="105" y="251" font-size="21" font-weight="700">决策依据</text>
  <line x1="218" y1="226" x2="218" y2="259" class="divider"/>
  <text x="245" y="251" class="body">角色：性格 · 关系 · 记忆</text>
  <text x="650" y="251" class="body">世界：库存 · 环境 · 能力</text>
  <text x="1085" y="251" class="body">任务：当前目标 · 长期承诺</text>
  <path d="M295 275V309" class="line" marker-end="url(#arrow)"/>
  <path d="M1305 275V309" class="line" marker-end="url(#arrow)"/>

  <!-- LLM -->
  <rect x="80" y="320" width="430" height="311" rx="6" class="outline"/>
  <text x="107" y="365" font-size="27" font-weight="700">LLM</text>
  <text x="482" y="364" text-anchor="end" font-size="18" class="secondary">表达与提议</text>
  <line x1="80" y1="386" x2="510" y2="386" class="divider"/>
  <text x="107" y="425" class="label">角色表达</text>
  <text x="107" y="458" class="body secondary">身份性格 · 对话交谈 · 内心想法</text>
  <text x="107" y="501" class="label">行动提议</text>
  <text x="107" y="534" class="body secondary">任务与承诺 · 交易协商 · 建筑方案</text>
  <text x="107" y="577" class="label">经历整理</text>
  <text x="107" y="610" class="body secondary">压缩旧记忆，供后续对话使用</text>

  <!-- Harness and existing adapters -->
  <rect x="585" y="320" width="430" height="311" rx="6" class="outline"/>
  <text x="612" y="365" font-size="27" font-weight="700">Harness 与协议接入</text>
  <line x1="585" y1="386" x2="1015" y2="386" class="divider"/>
  <text x="612" y="425" class="label">调用防护 · LLMGuard</text>
  <text x="612" y="458" class="body secondary">超时 · 熔断 · 失败标记 / 回退</text>
  <text x="612" y="501" class="label">输出适配与记录</text>
  <text x="612" y="534" class="body secondary">指令解析 · 目标入队 · 决策日志</text>
  <rect x="608" y="556" width="384" height="58" rx="3" fill="none" stroke="#84919d" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="625" y="580" font-size="17">ActionValidator：动作 / 配方 / 坐标校验</text>
  <text x="625" y="602" font-size="16" class="secondary">组件已有；每日决策入口尚未接入主循环</text>

  <!-- Rule and skill runtime -->
  <rect x="1090" y="320" width="430" height="311" rx="6" class="outline"/>
  <text x="1117" y="365" font-size="27" font-weight="700">规则与技能</text>
  <text x="1492" y="364" text-anchor="end" font-size="18" class="secondary">调度与执行</text>
  <line x1="1090" y1="386" x2="1520" y2="386" class="divider"/>
  <text x="1117" y="425" class="label">规则调度 · GoalScheduler</text>
  <text x="1117" y="458" class="body secondary">需求 / 职业候选 · Utility 选择</text>
  <text x="1117" y="501" class="label">技能执行 · BehaviorExecutor</text>
  <text x="1117" y="534" class="body secondary">能力门控 · 寻路交互 · 失败恢复</text>
  <text x="1117" y="577" class="label">专用世界操作</text>
  <text x="1117" y="610" class="body secondary">交易核库存 · 建造验结构与物资</text>

  <path d="M522 482H573" class="line" marker-end="url(#arrow)"/>
  <path d="M1027 482H1078" class="line" marker-end="url(#arrow)"/>

  <!-- Feedback loop -->
  <path d="M1305 631V676H295V642" class="line" marker-end="url(#arrow)"/>
  <rect x="516" y="660" width="570" height="30" fill="white"/>
  <text x="800" y="681" text-anchor="middle" font-size="19" class="secondary">执行反馈 → 事件记忆 / 关系更新 → 后续上下文</text>

  <!-- Correctness mechanisms, not a claim of a proof -->
  <line x1="80" y1="718" x2="1520" y2="718" class="divider"/>
  <text x="80" y="761" font-size="23" font-weight="700">状态有依据</text>
  <text x="80" y="795" class="body secondary">库存、能力、环境来自游戏状态</text>
  <text x="585" y="761" font-size="23" font-weight="700">执行有约束</text>
  <text x="585" y="795" class="body secondary">提议经过解析，动作遵循技能条件</text>
  <text x="1090" y="761" font-size="23" font-weight="700">失败有退路</text>
  <text x="1090" y="795" class="body secondary">规则可独立运行，失败进入恢复链</text>

  <text x="80" y="861" font-size="16" class="secondary">接入边界：本图为职责概览；部分直接 LLM 调用尚未统一经过 Guard，通用邀约与复杂计划仍属后续设计。</text>
  <text x="1520" y="861" text-anchor="end" font-size="16" class="secondary">Minecraft 1.16.5</text>
</svg>
